<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BABY DRIVE</title>
<style>
html,body{margin:0;height:100%;background:#87d4ff;overflow:hidden;touch-action:none;font-family:Inter,system-ui,Arial,sans-serif;color:#17324a}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none}
#score{position:absolute;top:16px;left:0;right:0;text-align:center;font-weight:900;font-size:28px}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(135,212,255,.78);pointer-events:auto}
.card{text-align:center;max-width:340px}
h1{margin:0;font-size:42px;letter-spacing:2px}
p{font-weight:700}
button{border:0;border-radius:999px;padding:14px 28px;font-weight:900;background:#ff8c42;color:#fff;font-size:16px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="score">0 m</div>
  <div id="overlay"><div class="card">
    <h1>BABY DRIVE</h1>
    <p>DRAG TO STEER<br>MISS THE CARS · GRAB BOTTLES</p>
    <button id="play">GO</button>
  </div></div>
</div>
<script>
const c=document.getElementById('c'), g=c.getContext('2d');
const overlay=document.getElementById('overlay'), scoreEl=document.getElementById('score');
let w,h,dpr,on=false,dist=0,best=+(localStorage.getItem('babybest')||0),speed=5,spawn=0,shake=0;
let car={x:0,tx:0}, lanes=[], bottles=[], roadY=0;
function resize(){ dpr=Math.min(devicePixelRatio||1,2); w=innerWidth; h=innerHeight; c.width=w*dpr; c.height=h*dpr; g.setTransform(dpr,0,0,dpr,0,0); car.x=car.tx=w/2; }
addEventListener('resize',resize); resize();
function aim(e){ const t=e.touches?e.touches[0]:e; car.tx=t.clientX; }
addEventListener('pointermove', e=>{ if(on) aim(e); });
addEventListener('touchmove', e=>{ e.preventDefault(); aim(e); }, {passive:false});
function start(){ on=true; dist=0; speed=5; lanes=[]; bottles=[]; spawn=0; car.x=car.tx=w/2; overlay.style.display='none'; }
function crash(){ on=false; best=Math.max(best,Math.floor(dist)); localStorage.setItem('babybest',best); overlay.style.display='grid'; overlay.querySelector('h1').textContent='OH NO'; overlay.querySelector('p').textContent=Math.floor(dist)+' m · BEST '+best; overlay.querySelector('button').textContent='AGAIN'; }
document.getElementById('play').onclick=e=>{ e.stopPropagation(); start(); };
function drawBaby(x,y){
  g.save(); g.translate(x,y);
  g.fillStyle='#ff5a6a'; g.fillRect(-28,8,56,26); g.fillRect(-34,16,10,16); g.fillRect(24,16,10,16);
  g.fillStyle='#222'; g.beginPath(); g.arc(-18,36,8,0,6.28); g.arc(18,36,8,0,6.28); g.fill();
  g.fillStyle='#ffd2b8'; g.beginPath(); g.arc(0,-6,16,0,6.28); g.fill();
  g.fillStyle='#7ecbff'; g.fillRect(-14,-16,28,10);
  g.fillStyle='#17324a'; g.fillRect(-6,-4,3,3); g.fillRect(3,-4,3,3);
  g.strokeStyle='#17324a'; g.beginPath(); g.arc(0,4,5,0.2,Math.PI-0.2); g.stroke();
  g.restore();
}
function loop(){
  requestAnimationFrame(loop);
  g.fillStyle='#87d4ff'; g.fillRect(0,0,w,h);
  g.fillStyle='#6d9a4a'; g.fillRect(0,0,w*0.12,h); g.fillRect(w*0.88,0,w*0.12,h);
  g.fillStyle='#4d5560'; g.fillRect(w*0.12,0,w*0.76,h);
  roadY=(roadY+speed)%40;
  g.strokeStyle='#f4f1c8'; g.lineWidth=4; g.setLineDash([16,18]);
  g.beginPath(); g.moveTo(w/2, -roadY); g.lineTo(w/2, h); g.stroke(); g.setLineDash([]);
  shake*=0.85;
  g.save(); g.translate((Math.random()-.5)*shake,0);
  if(on){
    car.x += (car.tx-car.x)*0.12;
    car.x=Math.max(w*0.2, Math.min(w*0.8, car.x));
    speed=Math.min(14, 5+dist/400);
    dist+=speed*0.08; spawn++;
    if(spawn%Math.max(28, 70-dist/80)===0) lanes.push({x:w*0.22+Math.random()*w*0.56, y:-80, col:['#3a7bd5','#f2c14e','#e15b64','#57b36a'][(Math.random()*4)|0]});
    if(spawn%55===0) bottles.push({x:w*0.22+Math.random()*w*0.56, y:-40});
    lanes.forEach(o=>o.y+=speed); bottles.forEach(b=>b.y+=speed);
    for(let i=lanes.length-1;i>=0;i--){ if(lanes[i].y>h+80) lanes.splice(i,1); else if(Math.abs(lanes[i].x-car.x)<42 && Math.abs(lanes[i].y-(h*0.78))<36){ shake=14; return crash(); } }
    for(let i=bottles.length-1;i>=0;i--){ if(bottles[i].y>h+40) bottles.splice(i,1); else if(Math.abs(bottles[i].x-car.x)<36 && Math.abs(bottles[i].y-(h*0.78))<30){ dist+=25; bottles.splice(i,1); } }
    scoreEl.textContent=Math.floor(dist)+' m';
  }
  bottles.forEach(b=>{ g.fillStyle='#fff'; g.fillRect(b.x-6,b.y-14,12,22); g.fillStyle='#9ad7ff'; g.fillRect(b.x-4,b.y-8,8,12); });
  lanes.forEach(o=>{ g.fillStyle=o.col; g.fillRect(o.x-22,o.y-36,44,64); g.fillStyle='#d7f3ff'; g.fillRect(o.x-16,o.y-28,32,16); });
  drawBaby(car.x, h*0.78);
  g.restore();
}
requestAnimationFrame(loop);
</script>
</body>
</html>
