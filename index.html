<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON RAID</title>
<style>
html,body{margin:0;height:100%;background:#07060d;color:#fff;font-family:Inter,system-ui,Arial,sans-serif;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;font-weight:800;letter-spacing:1px}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#1a1030,#07060d 70%);pointer-events:auto}
.card{text-align:center;padding:24px}
h1{margin:0;font-size:54px;letter-spacing:8px;background:linear-gradient(180deg,#fff,#9d7dff);-webkit-background-clip:text;background-clip:text;color:transparent}
p{opacity:.75;letter-spacing:2px}
button{pointer-events:auto;border:0;border-radius:999px;padding:14px 28px;font-weight:800;letter-spacing:2px;background:linear-gradient(90deg,#7c5cff,#ff4fd8);color:#fff;font-size:16px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="top"><div id="score">0</div><div id="best">BEST 0</div></div>
  <div id="overlay">
    <div class="card">
      <h1>NEON RAID</h1>
      <p>DRAG TO FLY · AUTO FIRE</p>
      <button id="play">PLAY</button>
    </div>
  </div>
</div>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
const overlay = document.getElementById('overlay'), scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
let w, h, dpr, running = false, score = 0, best = +(localStorage.getItem('neonbest')||0), t = 0;
let ship = {x:0,y:0,vx:0}, bullets = [], foes = [], gems = [], parts = [], stars = [], spawn = 0, shot = 0, shake = 0;
bestEl.textContent = 'BEST ' + best;
function resize(){ dpr = Math.min(devicePixelRatio||1, 2); w = innerWidth; h = innerHeight; c.width = w*dpr; c.height = h*dpr; x.setTransform(dpr,0,0,dpr,0,0); ship.x = w/2; ship.y = h*0.78; if(!stars.length){ for(let i=0;i<80;i++) stars.push({x:Math.random()*w,y:Math.random()*h,z:Math.random()*2+0.4}); } }
addEventListener('resize', resize); resize();
function pointer(e){ const p = e.touches ? e.touches[0] : e; ship.x += (p.clientX - ship.x)*0.35; ship.y += (p.clientY - ship.y)*0.25; ship.y = Math.max(h*0.45, Math.min(h*0.9, ship.y)); }
addEventListener('pointermove', e => { if(e.buttons||running) pointer(e); });
addEventListener('touchmove', e => { e.preventDefault(); pointer(e); }, {passive:false});
function burst(px,py,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28, s=Math.random()*4+1; parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:20+Math.random()*20,c:col}); } }
function start(){ running=true; score=0; bullets=[]; foes=[]; gems=[]; parts=[]; spawn=0; shot=0; ship.x=w/2; ship.y=h*0.78; overlay.style.display='none'; }
document.getElementById('play').onclick = start;
function end(){ running=false; best=Math.max(best,score); localStorage.setItem('neonbest', best); bestEl.textContent='BEST '+best; overlay.style.display='grid'; overlay.querySelector('h1').textContent='BUSTED'; overlay.querySelector('p').textContent='SCORE '+score; overlay.querySelector('button').textContent='AGAIN'; }
function loop(now){
  requestAnimationFrame(loop);
  t += 1;
  shake *= 0.9;
  x.fillStyle = '#07060d'; x.fillRect(0,0,w,h);
  x.save(); x.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  stars.forEach(s => { s.y += s.z*(running?2.2:0.6); if(s.y>h){s.y=0;s.x=Math.random()*w;} x.fillStyle='rgba(180,160,255,'+(0.2+s.z*0.2)+')'; x.fillRect(s.x,s.y,2,2); });
  if(running){
    shot++; if(shot%8===0) bullets.push({x:ship.x,y:ship.y-18,vy:-11});
    spawn++;
    if(spawn%Math.max(18, 46-score/80)===0) foes.push({x:30+Math.random()*(w-60), y:-30, vy:2.2+Math.min(4,score/400), hp:1+ (score>800?1:0), r:18});
    if(spawn%90===0) gems.push({x:40+Math.random()*(w-80), y:-20, vy:3});
    bullets.forEach(b => b.y += b.vy);
    foes.forEach(f => { f.y += f.vy; f.x += Math.sin((f.y+f.x)/40)*0.8; });
    gems.forEach(g => g.y += g.vy);
    bullets = bullets.filter(b => b.y>-20);
    for(let i=foes.length-1;i>=0;i--){
      const f=foes[i];
      if(Math.hypot(f.x-ship.x,f.y-ship.y)<f.r+16){ burst(ship.x,ship.y,'#ff4d6d',30); shake=16; return end(); }
      for(let j=bullets.length-1;j>=0;j--){
        if(Math.hypot(bullets[j].x-f.x, bullets[j].y-f.y)<f.r){ bullets.splice(j,1); f.hp--; burst(f.x,f.y,'#c9b6ff',8); if(f.hp<=0){ score+=10; burst(f.x,f.y,'#ff4fd8',16); foes.splice(i,1); shake=4; } break; }
      }
      if(f && f.y>h+40) foes.splice(i,1);
    }
    for(let i=gems.length-1;i>=0;i--){ if(Math.hypot(gems[i].x-ship.x,gems[i].y-ship.y)<28){ score+=25; burst(gems[i].x,gems[i].y,'#7cffd2',12); gems.splice(i,1);} else if(gems[i].y>h+20) gems.splice(i,1); }
    scoreEl.textContent = score;
  }
  parts.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.l--; });
  parts = parts.filter(p => p.l>0);
  gems.forEach(g => { x.fillStyle='#7cffd2'; x.beginPath(); x.arc(g.x,g.y,7,0,6.28); x.fill(); });
  foes.forEach(f => { x.fillStyle='#ff4d6d'; x.beginPath(); x.moveTo(f.x,f.y-f.r); x.lineTo(f.x+f.r,f.y+f.r); x.lineTo(f.x-f.r,f.y+f.r); x.closePath(); x.fill(); });
  bullets.forEach(b => { x.fillStyle='#efe9ff'; x.fillRect(b.x-2,b.y-8,4,14); });
  parts.forEach(p => { x.globalAlpha=Math.max(0,p.l/30); x.fillStyle=p.c; x.fillRect(p.x,p.y,3,3); x.globalAlpha=1; });
  x.save(); x.translate(ship.x, ship.y);
  x.fillStyle='#9d7dff'; x.beginPath(); x.moveTo(0,-22); x.lineTo(16,16); x.lineTo(0,8); x.lineTo(-16,16); x.closePath(); x.fill();
  x.fillStyle='#fff'; x.fillRect(-3,-6,6,10);
  x.restore();
  x.restore();
}
requestAnimationFrame(loop);
</script>
</body>
</html>
