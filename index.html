<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050908">
<meta name="description" content="JACK23 Crossbar Elite — premium football shooting game">
<title>JACK23 — Crossbar Elite</title>
<style>
:root{--lime:#d8ff4f;--cyan:#55eaff;--white:#f7faf8;--muted:#a8b5ae;--glass:rgba(5,14,10,.68);--line:rgba(255,255,255,.13)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050908;color:var(--white);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}button{font:inherit}
#flash{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;background:white;mix-blend-mode:screen}#toast{position:fixed;z-index:20;top:17%;left:50%;transform:translate(-50%,-15px) scale(.92);opacity:0;pointer-events:none;padding:11px 18px;border:1px solid rgba(216,255,79,.35);border-radius:999px;background:rgba(5,15,10,.82);backdrop-filter:blur(14px);font-size:12px;font-weight:950;letter-spacing:.08em;white-space:nowrap;transition:.25s ease;box-shadow:0 15px 50px rgba(0,0,0,.45)}#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.hud{position:fixed;z-index:5;inset:0;pointer-events:none;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between}.top,.bottom{display:flex;justify-content:space-between;align-items:flex-start}.bottom{align-items:flex-end}.brand{font-size:11px;font-weight:950;letter-spacing:.15em;text-shadow:0 3px 15px #000}.brand span{color:var(--lime)}.stat{min-width:82px;padding:9px 12px;border:1px solid var(--line);border-radius:15px;background:var(--glass);backdrop-filter:blur(14px);box-shadow:0 15px 40px rgba(0,0,0,.3)}.stat.right{text-align:right}.number{font-size:25px;line-height:1;font-weight:950}.caption{margin-top:4px;color:var(--muted);font-size:8px;font-weight:800;letter-spacing:.15em}.tip{max-width:225px;text-align:center;color:#dce7e1;font-size:11px;line-height:1.35;text-shadow:0 3px 12px #000}
.overlay{position:fixed;z-index:50;inset:0;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 38%,rgba(40,120,72,.25),transparent 45%),rgba(2,6,4,.84);backdrop-filter:blur(10px)}.card{width:min(430px,100%);padding:29px;text-align:center;border:1px solid rgba(216,255,79,.22);border-radius:29px;background:linear-gradient(145deg,rgba(9,20,15,.96),rgba(7,13,11,.88));box-shadow:0 35px 110px rgba(0,0,0,.62),inset 0 1px rgba(255,255,255,.08)}.kicker{color:var(--lime);font-size:9px;font-weight:950;letter-spacing:.25em}h1{margin:9px 0 8px;font-size:clamp(43px,12vw,64px);line-height:.86;letter-spacing:-.075em}h1 span{color:var(--lime)}.description{max-width:330px;margin:0 auto 21px;color:var(--muted);font-size:13px;line-height:1.5}.cta{width:100%;padding:17px;border:0;border-radius:16px;background:var(--lime);color:#091009;font-weight:950;letter-spacing:.04em;box-shadow:0 12px 45px rgba(216,255,79,.2);cursor:pointer}.cta:active{transform:scale(.98)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.control{padding:10px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.035);color:var(--muted);font-size:9px}.control strong{display:block;margin-bottom:2px;color:white}.hidden{display:none!important}
</style></head><body>
<canvas id="game"></canvas><div id="flash"></div><div id="toast"></div>
<div id="start" class="overlay"><div class="card"><div class="kicker">JACK23 // ELITE TRAINING</div><h1>CROSSBAR<br><span>ELITE</span></h1><p class="description">Swipe from the ball toward the target. Bend it, clip the bar, build your streak and chase the perfect strike.</p><button class="cta" id="play">ENTER THE STADIUM</button><div class="controls"><div class="control"><strong>SWIPE</strong>Aim + power</div><div class="control"><strong>CROSSBAR</strong>Hit it for bonus</div></div></div></div>
<div id="hud" class="hud hidden"><div class="top"><div class="brand">JACK<span>23</span> / CROSSBAR ELITE</div><div class="stat right"><div class="number" id="score">0</div><div class="caption">SCORE</div></div></div><div class="bottom"><div class="stat"><div class="number" id="streak">0×</div><div class="caption">STREAK</div></div><div class="tip">Swipe upward toward the bar.</div></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);const $=id=>document.getElementById(id);
const state={score:0,streak:0,best:0,shots:0,phase:0,goalY:0,ballHome:{x:0,y:0},ball:{x:0,y:0,r:14},shot:null,particles:[],trails:[],shake:0,flash:0,last:performance.now()};
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);state.goalY=H*.285;state.ballHome={x:W*.5,y:H*.755};if(!state.shot)state.ball={...state.ballHome,r:14}}
addEventListener('resize',resize);function rand(a,b){return a+Math.random()*(b-a)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
let audio=null;function startAudio(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}function beep(f=440,d=.08,type='sine',v=.035){if(!audio)return;try{const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function burst(x,y,type='lime',n=30,power=1){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),s=rand(100,430)*power;state.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.35,.85),max:.8,size:rand(1.5,4),type})}}
function impact(s=1){state.shake=Math.max(state.shake,12*s);state.flash=Math.max(state.flash,.16*s)}function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),950)}
function drawStadium(){const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#07100d');sky.addColorStop(.48,'#0b2118');sky.addColorStop(1,'#05100b');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);const glow=ctx.createRadialGradient(W*.5,H*.25,10,W*.5,H*.25,W*.65);glow.addColorStop(0,'rgba(60,160,100,.18)');glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);const horizon=H*.34;ctx.fillStyle='#101a16';ctx.fillRect(0,horizon,W,H*.23);for(let r=0;r<8;r++){ctx.fillStyle=r%2?'#18251f':'#0d1713';ctx.fillRect(0,horizon+r*H*.027,W,H*.027)}for(let i=0;i<150;i++){const x=(i*83)%W,y=horizon+((i*47)%110)*H*.001;ctx.fillStyle=i%15===0?'rgba(216,255,79,.9)':'rgba(255,255,255,.13)';ctx.fillRect(x,y,2,2)}for(let i=0;i<9;i++){const x=W*(.05+i*.112);ctx.fillStyle='rgba(255,255,255,.9)';ctx.shadowBlur=25;ctx.shadowColor='rgba(255,255,255,.9)';ctx.fillRect(x,H*.065,3,3);ctx.shadowBlur=0}const topY=H*.415,bottomY=H*1.04;ctx.beginPath();ctx.moveTo(W*.23,topY);ctx.lineTo(W*.77,topY);ctx.lineTo(W*.99,bottomY);ctx.lineTo(W*.01,bottomY);ctx.closePath();ctx.fillStyle='#0b5d34';ctx.fill();for(let i=0;i<11;i++){const t=i/10,y=topY+(bottomY-topY)*t;ctx.fillStyle=i%2?'rgba(255,255,255,.025)':'rgba(0,0,0,.04)';ctx.beginPath();ctx.moveTo(W*(.23-.22*t),y);ctx.lineTo(W*(.77+.22*t),y);ctx.lineTo(W*(.77+.22*(t+.1)),y+(bottomY-topY)*.1);ctx.lineTo(W*(.23-.22*(t+.1)),y+(bottomY-topY)*.1);ctx.closePath();ctx.fill()}ctx.strokeStyle='rgba(255,255,255,.42)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W*.23,topY);ctx.lineTo(W*.77,topY);ctx.moveTo(W*.5,topY);ctx.lineTo(W*.5,bottomY);ctx.stroke();ctx.beginPath();ctx.moveTo(W*.39,H*.54);ctx.lineTo(W*.61,H*.54);ctx.lineTo(W*.73,H*.79);ctx.lineTo(W*.27,H*.79);ctx.closePath();ctx.stroke()}
function drawGoal(){const x=W*.19,width=W*.62,y=state.goalY,height=H*.205;ctx.save();ctx.globalAlpha=.3;ctx.strokeStyle='#e5f1eb';ctx.lineWidth=1;for(let i=0;i<14;i++){const xx=x+width*i/13;ctx.beginPath();ctx.moveTo(xx,y);ctx.lineTo(xx+(i-6.5)*5,y+height);ctx.stroke()}for(let i=0;i<7;i++){const yy=y+height*i/6;ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+width,yy);ctx.stroke()}ctx.restore();ctx.save();ctx.strokeStyle='#fff';ctx.lineWidth=9;ctx.lineCap='round';ctx.shadowBlur=18;ctx.shadowColor='rgba(255,255,255,.6)';ctx.beginPath();ctx.moveTo(x,y+height);ctx.lineTo(x,y);ctx.lineTo(x+width,y);ctx.lineTo(x+width,y+height);ctx.stroke();ctx.restore();ctx.strokeStyle='rgba(216,255,79,.55)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+6,y+6);ctx.lineTo(x+width-6,y+6);ctx.stroke()}
function drawPlayer(){const x=W*.5,y=H*.73,scale=Math.min(W/390,1.12);ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.fillStyle='rgba(0,0,0,.38)';ctx.beginPath();ctx.ellipse(0,82,51,12,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#0a0e0c';ctx.lineWidth=16;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-10,45);ctx.lineTo(-24,80);ctx.moveTo(10,45);ctx.lineTo(25,80);ctx.stroke();ctx.strokeStyle='#f3f6f4';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-25,80);ctx.lineTo(-38,80);ctx.moveTo(25,80);ctx.lineTo(38,80);ctx.stroke();ctx.fillStyle='#111b17';ctx.beginPath();ctx.roundRect(-32,-8,64,61,13);ctx.fill();ctx.strokeStyle='rgba(216,255,79,.5)';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#18251f';ctx.beginPath();ctx.moveTo(-31,-3);ctx.lineTo(-48,16);ctx.lineTo(-40,25);ctx.lineTo(-25,12);ctx.moveTo(31,-3);ctx.lineTo(48,16);ctx.lineTo(40,25);ctx.lineTo(25,12);ctx.fill();ctx.strokeStyle='#a86d4c';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(-44,18);ctx.lineTo(-51,42);ctx.moveTo(44,18);ctx.lineTo(51,42);ctx.stroke();ctx.fillStyle='#a96e4d';ctx.fillRect(-9,-19,18,14);ctx.beginPath();ctx.arc(0,-34,22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#17130f';ctx.beginPath();ctx.arc(0,-40,22,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#d8ff4f';ctx.font='950 28px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('23',0,20);ctx.restore()}
function drawBall(){const b=state.ball;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(state.phase*.8);ctx.shadowBlur=18;ctx.shadowColor='rgba(255,255,255,.35)';ctx.fillStyle='#f7faf8';ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#101713';ctx.beginPath();for(let i=0;i<5;i++){const a=i*Math.PI*2/5,x=Math.cos(a)*b.r*.38,y=Math.sin(a)*b.r*.38;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fill();ctx.restore()}
const input={start:null,x:0,y:0};function pointerDown(e){startAudio();if(state.shot)return;input.start={x:e.clientX,y:e.clientY};input.x=e.clientX;input.y=e.clientY}function pointerMove(e){if(!input.start)return;input.x=e.clientX;input.y=e.clientY}function pointerUp(){if(!input.start)return;const dx=input.x-input.start.x,dy=input.y-input.start.y,len=Math.hypot(dx,dy);input.start=null;if(len<35)return;shoot(dx,dy,len)}canvas.addEventListener('pointerdown',pointerDown);canvas.addEventListener('pointermove',pointerMove);canvas.addEventListener('pointerup',pointerUp);canvas.addEventListener('pointercancel',()=>input.start=null);
function shoot(dx,dy,length){const angle=Math.atan2(dy,dx),power=clamp(length/210,.28,1),speed=820+720*power;state.shot={x:state.ball.x,y:state.ball.y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,power,curve:clamp(dx/300,-.8,.8),time:0,bar:false,goal:false};state.trails=[];state.shots++;beep(180,.06,'triangle',.045)}
function update(dt){state.phase+=dt;state.shake*=Math.pow(.03,dt);state.flash=Math.max(0,state.flash-dt*1.8);for(const p of state.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=420*dt;p.vx*=Math.pow(.03,dt);p.life-=dt}state.particles=state.particles.filter(p=>p.life>0);for(const t of state.trails)t.life-=dt;state.trails=state.trails.filter(t=>t.life>0);if(state.shot){const s=state.shot;s.time+=dt;s.vx+=s.curve*380*dt;s.vy+=620*dt;s.vx*=Math.pow(.15,dt);s.vy*=Math.pow(.45,dt);s.x+=s.vx*dt;s.y+=s.vy*dt;state.trails.push({x:s.x,y:s.y,r:state.ball.r*rand(.45,.9),life:.3});if(state.trails.length>18)state.trails.shift();state.ball.x=s.x;state.ball.y=s.y;const goalX=W*.19,goalW=W*.62,barY=state.goalY;if(!s.bar&&s.y>barY-13&&s.y<barY+13&&s.x>goalX&&s.x<goalX+goalW&&s.vy<0){s.bar=true;s.vy*=-.72;s.vx*=.86;const bonus=150+state.streak*25;state.score+=bonus;state.streak++;state.best=Math.max(state.best,state.streak);burst(s.x,barY,'lime',55,1.2);impact(1.25);beep(820,.12,'square',.055);beep(1180,.16,'sine',.035);toast('CROSSBAR +'+bonus)}if(!s.goal&&s.y<barY+38&&s.y>barY-80&&s.x>goalX+10&&s.x<goalX+goalW-10&&s.vy<0)s.goal=true;if(s.y<barY-80||s.x<-60||s.x>W+60||s.y>H+80||s.time>2.6)finishShot(s.goal||s.bar)}else state.ball={...state.ballHome,r:14};$('score').textContent=state.score.toLocaleString();$('streak').textContent=state.streak+'×'}
function finishShot(success){const s=state.shot;if(success){if(s.goal){const reward=500+state.streak*50;state.score+=reward;burst(clamp(s.x,0,W),clamp(s.y,0,H),'cyan',65,1.15);beep(520,.1,'sine',.05);beep(780,.18,'sine',.05);toast('PERFECT FINISH +'+reward)}}else{state.streak=0;beep(95,.13,'sawtooth',.035);toast('RESET — AIM HIGHER')}impact(success?1:.35);state.shot=null;state.ball={...state.ballHome,r:14}}
function render(){ctx.save();if(state.shake>0)ctx.translate(rand(-state.shake,state.shake),rand(-state.shake,state.shake));drawStadium();drawGoal();drawPlayer();if(!state.shot&&input.start){ctx.save();ctx.strokeStyle='rgba(216,255,79,.65)';ctx.lineWidth=2;ctx.setLineDash([5,7]);ctx.beginPath();ctx.moveTo(state.ball.x,state.ball.y);ctx.lineTo(input.x,input.y);ctx.stroke();ctx.restore()}for(const t of state.trails){ctx.globalAlpha=t.life*.25;ctx.fillStyle='#d8ff4f';ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;drawBall();for(const p of state.particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.type==='cyan'?'#55eaff':p.type==='lime'?'#d8ff4f':'#fff';ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.restore()}
function loop(now){const dt=Math.min(.032,(now-state.last)/1000);state.last=now;update(dt);render();$('flash').style.opacity=state.flash;requestAnimationFrame(loop)}resize();state.ball={...state.ballHome,r:14};requestAnimationFrame(loop);$('play').addEventListener('click',()=>{startAudio();$('start').classList.add('hidden');$('hud').classList.remove('hidden');toast('GO — HIT THE BAR')});
})();
</script></body></html>
