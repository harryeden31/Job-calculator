<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WAND</title>
<style>
html,body{margin:0;height:100%;background:#140818;overflow:hidden;touch-action:none;font-family:Inter,system-ui,Arial,sans-serif;color:#fff}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none}
#score{position:absolute;top:16px;left:0;right:0;text-align:center;font-weight:900;font-size:28px;letter-spacing:2px}
#hp{position:absolute;top:54px;left:50%;transform:translateX(-50%);width:180px;height:8px;border-radius:99px;background:#ffffff22;overflow:hidden}
#hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7cffd2,#e7b0ff)}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,8,24,.8);pointer-events:auto}
.card{text-align:center;max-width:340px;padding:12px}
h1{margin:0;font-size:58px;letter-spacing:8px;background:linear-gradient(180deg,#fff,#e7b0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
p{opacity:.78;letter-spacing:1px;line-height:1.5}
button{border:0;border-radius:999px;padding:14px 28px;font-weight:900;letter-spacing:2px;background:#c56bff;color:#fff;font-size:16px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="score">0 FAIRIES</div>
  <div id="hp"><i id="bar"></i></div>
  <div id="overlay"><div class="card">
    <h1>WAND</h1>
    <p>DRAG THE WAND<br>CATCH THE GLOWING FAIRIES<br>DODGE THE DARK ONES</p>
    <button id="play">PLAY</button>
  </div></div>
</div>
<script>
const c=document.getElementById('c'), g=c.getContext('2d');
const overlay=document.getElementById('overlay'), scoreEl=document.getElementById('score'), bar=document.getElementById('bar');
let w,h,dpr,on=false,score=0,best=+(localStorage.getItem('wandbest')||0),hp=100,spawn=0,shake=0,combo=0,comboT=0;
let wand={x:0,y:0,tx:0,ty:0,a:0}, fairies=[], motes=[], sparks=[];
const colors=['#ffd6f5','#b9f6ff','#ffe9a8','#e7b0ff','#9dffc8'];
function resize(){ dpr=Math.min(devicePixelRatio||1,2); w=innerWidth; h=innerHeight; c.width=w*dpr; c.height=h*dpr; g.setTransform(dpr,0,0,dpr,0,0); if(!wand.x){wand.x=wand.tx=w/2; wand.y=wand.ty=h*0.72;} }
addEventListener('resize',resize); resize();
function aim(e){ const t=e.touches?e.touches[0]:e; wand.tx=t.clientX; wand.ty=t.clientY; }
addEventListener('pointermove', e=>{ if(on) aim(e); });
addEventListener('touchmove', e=>{ e.preventDefault(); aim(e); }, {passive:false});
function puff(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,s=Math.random()*3+0.4; sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-0.4,l:24+Math.random()*20,c:col}); } }
function start(){ on=true; score=0; hp=100; fairies=[]; sparks=[]; spawn=0; combo=0; wand.x=wand.tx=w/2; wand.y=wand.ty=h*0.72; overlay.style.display='none'; }
function dead(){ on=false; best=Math.max(best,score); localStorage.setItem('wandbest',best); overlay.style.display='grid'; overlay.querySelector('h1').textContent='SNAPPED'; overlay.querySelector('p').textContent='CAUGHT '+score+' · BEST '+best; overlay.querySelector('button').textContent='AGAIN'; }
document.getElementById('play').onclick=e=>{ e.stopPropagation(); start(); };
function loop(now){
  requestAnimationFrame(loop);
  g.fillStyle='#140818'; g.fillRect(0,0,w,h);
  if(motes.length<40) motes.push({x:Math.random()*w,y:Math.random()*h,s:Math.random()*1.5+0.4,v:Math.random()*0.4+0.15});
  motes.forEach(m=>{ m.y-=m.v; if(m.y<0){m.y=h; m.x=Math.random()*w;} g.fillStyle='rgba(255,220,255,.35)'; g.fillRect(m.x,m.y,m.s,m.s); });
  shake*=0.88;
  g.save(); g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  if(on){
    wand.x += (wand.tx-wand.x)*0.22; wand.y += (wand.ty-wand.y)*0.22;
    wand.a += 0.08;
    spawn++;
    const every=Math.max(28, 62-score*0.4);
    if(spawn%Math.floor(every)===0){
      const dark=Math.random()<Math.min(0.45,0.12+score*0.004);
      fairies.push({x:30+Math.random()*(w-60), y:-30, vx:(Math.random()-0.5)*1.4, vy:1.3+Math.random()*1.2+score*0.01, r:16, dark, flap:Math.random()*6, c:colors[(Math.random()*colors.length)|0]});
    }
    fairies.forEach(f=>{ f.flap+=0.2; f.x+=Math.sin(f.flap)*0.8+f.vx*0.3; f.y+=f.vy; });
    const tipx=wand.x+Math.cos(wand.a)*46, tipy=wand.y+Math.sin(wand.a)*18-36;
    for(let i=fairies.length-1;i>=0;i--){
      const f=fairies[i];
      if(Math.hypot(f.x-tipx,f.y-tipy)<f.r+18){
        if(f.dark){ hp-=16; shake=12; puff(f.x,f.y,'#7a4cff',16); combo=0; }
        else { score++; combo=Math.min(8,combo+1); comboT=50; hp=Math.min(100,hp+2); shake=4; puff(f.x,f.y,f.c,14); }
        fairies.splice(i,1); continue;
      }
      if(f.y>h+30){ if(!f.dark) hp-=6; fairies.splice(i,1); }
    }
    if(comboT>0) comboT--; else combo=0;
    if(hp<=0) return dead();
    scoreEl.textContent=(combo>1?combo+'x  ':'')+score+' FAIRIES';
    bar.style.width=Math.max(0,hp)+'%';
  }
  sparks.forEach(s=>{ s.x+=s.vx; s.y+=s.vy; s.l--; }); sparks=sparks.filter(s=>s.l>0);
  fairies.forEach(f=>{
    g.save(); g.translate(f.x,f.y);
    const wing=Math.sin(f.flap)*8;
    g.fillStyle=f.dark?'rgba(90,40,180,.55)':'rgba(255,255,255,.45)';
    g.beginPath(); g.ellipse(-12,0,10,6+wing*0.2,-0.6,0,6.28); g.fill();
    g.beginPath(); g.ellipse(12,0,10,6+wing*0.2,0.6,0,6.28); g.fill();
    g.fillStyle=f.dark?'#3a1860':f.c;
    g.beginPath(); g.arc(0,0,f.r*0.55,0,6.28); g.fill();
    g.restore();
  });
  sparks.forEach(s=>{ g.globalAlpha=Math.max(0,s.l/28); g.fillStyle=s.c; g.fillRect(s.x,s.y,3,3); g.globalAlpha=1; });
  g.save(); g.translate(wand.x,wand.y);
  g.strokeStyle='#f4d7ff'; g.lineWidth=6; g.lineCap='round';
  g.beginPath(); g.moveTo(-8,28); g.quadraticCurveTo(6,0,18,-34); g.stroke();
  g.fillStyle='#fff6c8'; g.beginPath(); g.arc(22,-40,7+Math.sin(wand.a)*1.5,0,6.28); g.fill();
  g.strokeStyle='rgba(255,220,140,.45)'; g.lineWidth=2; g.beginPath(); g.arc(22,-40,16,0,6.28); g.stroke();
  g.restore();
  g.restore();
}
requestAnimationFrame(loop);
</script>
</body>
</html>
