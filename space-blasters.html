<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Blasters</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050510;color:#fff;font-family:Arial,sans-serif;overflow:hidden;user-select:none}
#game{display:block;margin:0 auto;background:radial-gradient(circle at 50% 20%,#11113a 0%,#050510 55%,#000 100%);width:100vw;height:100vh}
#ui{position:fixed;top:15px;left:50%;transform:translateX(-50%);width:min(900px,94vw);display:flex;justify-content:space-between;font-size:20px;font-weight:bold;pointer-events:none;text-shadow:0 0 10px #00ffff}
#message{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;flex-direction:column;background:rgba(0,0,0,.65);text-align:center}
#message h1{font-size:clamp(40px,8vw,80px);margin:0 0 10px;color:#00ffff;text-shadow:0 0 10px #00ffff,0 0 30px #0088ff}
#message p{font-size:20px;margin:8px}
button{margin-top:20px;padding:14px 30px;border:2px solid #00ffff;border-radius:8px;background:transparent;color:white;font-size:18px;cursor:pointer;box-shadow:0 0 15px #00ffff}
button:hover{background:#00ffff;color:#000}
#mobileControls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:15px}
#mobileControls button{margin:0;width:70px;height:55px;padding:0;font-size:25px;background:rgba(0,255,255,.08)}
@media(min-width:700px){#mobileControls{display:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"><div>Score: <span id="score">0</span></div><div>Lives: <span id="lives">3</span></div><div>Level: <span id="level">1</span></div></div>
<div id="message"><h1>SPACE BLASTERS</h1><p>Destroy the aliens before they reach you!</p><p>← → to move &nbsp; | &nbsp; SPACE to shoot</p><button id="startButton">START GAME</button></div>
<div id="mobileControls"><button id="leftBtn">◀</button><button id="shootBtn">●</button><button id="rightBtn">▶</button></div>

<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const scoreText=document.getElementById("score"),livesText=document.getElementById("lives"),levelText=document.getElementById("level");
const message=document.getElementById("message"),startButton=document.getElementById("startButton");
let W,H;function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}addEventListener("resize",resize);resize();
let score=0,lives=3,level=1,gameRunning=false;const keys={};
addEventListener("keydown",e=>{keys[e.key]=true;if(e.key===" ")e.preventDefault()});
addEventListener("keyup",e=>keys[e.key]=false);

const player={x:0,y:0,width:50,height:25,speed:7,cooldown:0};
function resetPlayer(){player.x=W/2-player.width/2;player.y=H-80;player.cooldown=0}
let bullets=[],enemyBullets=[],aliens=[],alienDirection=1,alienSpeed=.5;

function shoot(){if(player.cooldown<=0){bullets.push({x:player.x+player.width/2-2,y:player.y,width:4,height:15,speed:10});player.cooldown=15}}
function createAliens(){
 aliens=[];const rows=Math.min(3+level,7),cols=Math.min(7+level,11),aw=35,ah=25,gx=20,gy=18;
 const startX=(W-(cols*aw+(cols-1)*gx))/2;
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)aliens.push({x:startX+c*(aw+gx),y:90+r*(ah+gy),width:aw,height:ah,alive:true,type:r%3});
}
function moveAliens(){
 let edge=false;
 for(const a of aliens){if(!a.alive)continue;a.x+=alienDirection*alienSpeed;if(a.x+a.width>=W-10||a.x<=10)edge=true}
 if(edge){alienDirection*=-1;for(const a of aliens)a.y+=20}
 if(Math.random()<.006+level*.001){const living=aliens.filter(a=>a.alive);if(living.length){const a=living[Math.floor(Math.random()*living.length)];enemyBullets.push({x:a.x+a.width/2-2,y:a.y+a.height,width:4,height:12,speed:4+level*.3})}}
}
function drawPlayer(){
 ctx.save();ctx.shadowBlur=20;ctx.shadowColor="#00ffff";ctx.fillStyle="#00ffff";
 ctx.beginPath();ctx.moveTo(player.x+player.width/2,player.y-15);ctx.lineTo(player.x,player.y+player.height);ctx.lineTo(player.x+player.width/2,player.y+player.height-7);ctx.lineTo(player.x+player.width,player.y+player.height);ctx.closePath();ctx.fill();ctx.restore()
}
function drawAlien(a){
 ctx.save();let color=a.type===0?"#ff4dff":a.type===1?"#ffcc00":"#00ff88";ctx.fillStyle=color;ctx.shadowBlur=15;ctx.shadowColor=color;
 const{x,y,width:w,height:h}=a;ctx.fillRect(x+5,y+5,w-10,h-10);ctx.fillRect(x+10,y,w-20,8);ctx.fillRect(x+3,y+h-5,8,7);ctx.fillRect(x+w-11,y+h-5,8,7);
 ctx.fillStyle="#050510";ctx.fillRect(x+10,y+8,5,5);ctx.fillRect(x+w-15,y+8,5,5);ctx.restore()
}
function drawBullet(b,enemy=false){ctx.save();ctx.fillStyle=enemy?"#ff3333":"#fff";ctx.shadowBlur=15;ctx.shadowColor=enemy?"#f00":"#00ffff";ctx.fillRect(b.x,b.y,b.width,b.height);ctx.restore()}
function drawStars(){for(let i=0;i<80;i++){const x=i*137%W,y=i*83%H;ctx.fillStyle="rgba(255,255,255,.5)";ctx.fillRect(x,y,1,1)}}
function collision(a,b){return a.x<b.x+b.width&&a.x+a.width>b.x&&a.y<b.y+b.height&&a.y+a.height>b.y}

function update(){
 if(!gameRunning)return;
 if(keys.ArrowLeft||keys.a||keys.A)player.x-=player.speed;
 if(keys.ArrowRight||keys.d||keys.D)player.x+=player.speed;
 player.x=Math.max(0,Math.min(W-player.width,player.x));
 if(keys[" "]||keys.Spacebar)shoot();if(player.cooldown>0)player.cooldown--;

 for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.y-=b.speed;if(b.y<-20){bullets.splice(i,1);continue}
  for(const a of aliens)if(a.alive&&collision(b,a)){a.alive=false;bullets.splice(i,1);score+=10*level;scoreText.textContent=score;break}
 }
 for(let i=enemyBullets.length-1;i>=0;i--){const b=enemyBullets[i];b.y+=b.speed;if(b.y>H+20){enemyBullets.splice(i,1);continue}
  if(collision(b,player)){enemyBullets.splice(i,1);lives--;livesText.textContent=lives;resetPlayer();if(lives<=0){endGame(false);return}}
 }
 moveAliens();
 for(const a of aliens)if(a.alive&&a.y+a.height>=player.y){endGame(false);return}
 if(aliens.every(a=>!a.alive)){level++;levelText.textContent=level;alienSpeed+=.15;bullets=[];enemyBullets=[];createAliens()}
}
function draw(){
 ctx.clearRect(0,0,W,H);drawStars();for(const a of aliens)if(a.alive)drawAlien(a);for(const b of bullets)drawBullet(b);for(const b of enemyBullets)drawBullet(b,true);drawPlayer()
}
function loop(){update();draw();requestAnimationFrame(loop)}
function startGame(){score=0;lives=3;level=1;alienSpeed=.5;alienDirection=1;bullets=[];enemyBullets=[];scoreText.textContent=0;livesText.textContent=3;levelText.textContent=1;resetPlayer();createAliens();gameRunning=true;message.style.display="none"}
function endGame(){gameRunning=false;message.style.display="flex";message.querySelector("h1").textContent="GAME OVER";message.querySelector("p").textContent="The aliens got through!";startButton.textContent="PLAY AGAIN"}
startButton.addEventListener("click",startGame);

function holdKey(key,button){button.addEventListener("pointerdown",e=>{e.preventDefault();keys[key]=true});button.addEventListener("pointerup",e=>{e.preventDefault();keys[key]=false});button.addEventListener("pointerleave",()=>keys[key]=false)}
holdKey("ArrowLeft",document.getElementById("leftBtn"));holdKey("ArrowRight",document.getElementById("rightBtn"));holdKey(" ",document.getElementById("shootBtn"));
resetPlayer();loop();
</script>
</body>
</html>
