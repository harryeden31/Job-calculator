<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RAZE</title>
<style>
html,body{margin:0;height:100%;background:#100814;overflow:hidden;touch-action:none;font-family:Inter,system-ui,Arial,sans-serif;color:#fff}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none}
#score{position:absolute;top:16px;left:0;right:0;text-align:center;font-weight:900;font-size:28px;letter-spacing:2px}
#hp{position:absolute;top:54px;left:50%;transform:translateX(-50%);width:180px;height:8px;border-radius:99px;background:#ffffff22;overflow:hidden}
#hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff4d6d,#ffd15a)}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(16,8,20,.78);pointer-events:auto}
.card{text-align:center;max-width:320px;padding:12px}
h1{margin:0;font-size:62px;letter-spacing:8px;background:linear-gradient(180deg,#fff,#ff5ad4);-webkit-background-clip:text;background-clip:text;color:transparent}
p{opacity:.75;letter-spacing:1px}
button{border:0;border-radius:999px;padding:14px 28px;font-weight:900;letter-spacing:2px;background:#ff4fd8;color:#fff;font-size:16px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="score">WAVE 1</div>
  <div id="hp"><i id="bar"></i></div>
  <div id="overlay"><div class="card">
    <h1>RAZE</h1>
    <p>DRAG TO MOVE · AUTO SLASH<br>DON'T LET THEM TOUCH YOU</p>
    <button id="play">PLAY</button>
  </div></div>
</div>
<script>
const c=document.getElementById('c'), g=c.getContext('2d');
const overlay=document.getElementById('overlay'), scoreEl=document.getElementById('score'), bar=document.getElementById('bar');
let w,h,dpr,on=false,score=0,wave=1,hp=100,spawn=0,shake=0,combo=0,comboT=0;
let p={x:0,y:0,tx:0,ty:0}, foes=[], slashes=[], bits=[], drops=[];
function resize(){ dpr=Math.min(devicePixelRatio||1,2); w=innerWidth; h=innerHeight; c.width=w*dpr; c.height=h*dpr; g.setTransform(dpr,0,0,dpr,0,0); if(!p.x){p.x=p.tx=w/2;p.y=p.ty=h/2;} }
addEventListener('resize',resize); resize();
function aim(e){ const t=e.touches?e.touches[0]:e; p.tx=t.clientX; p.ty=t.clientY; }
addEventListener('pointermove', e=>{ if(on) aim(e); });
addEventListener('touchmove', e=>{ e.preventDefault(); aim(e); }, {passive:false});
function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,s=1+Math.random()*5; bits.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:18+Math.random()*16,c:col}); } }
function start(){ on=true; score=0; wave=1; hp=100; foes=[]; slashes=[]; drops=[]; spawn=0; p.x=p.tx=w/2; p.y=p.ty=h/2; overlay.style.display='none'; }
function dead(){ on=false; overlay.style.display='grid'; overlay.querySelector('h1').textContent='RAZED'; overlay.querySelector('p').textContent='SCORE '+score+' · WAVE '+wave; overlay.querySelector('button').textContent='AGAIN'; }
document.getElementById('play').onclick=e=>{ e.stopPropagation(); start(); };
function loop(){
  requestAnimationFrame(loop);
  g.fillStyle='#100814'; g.fillRect(0,0,w,h);
  shake*=0.86;
  g.save(); g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  if(on){
    p.x += (p.tx-p.x)*0.18; p.y += (p.ty-p.y)*0.18;
    spawn++;
    const every=Math.max(22, 70-wave*4);
    if(spawn%every===0){ const edge=Math.floor(Math.random()*4); let x=Math.random()*w,y=Math.random()*h; if(edge===0)y=-20; if(edge===1)y=h+20; if(edge===2)x=-20; if(edge===3)x=w+20; foes.push({x,y,r:14+Math.random()*10,hp:1+(wave>4?1:0),fast:Math.random()<.25}); }
    if(score>0 && score%120===0 && spawn%every===0) wave++;
    foes.forEach(f=>{ const dx=p.x-f.x, dy=p.y-f.y, d=Math.hypot(dx,dy)||1; const sp=f.fast?2.7:1.7; f.x+=dx/d*(sp+wave*0.08); f.y+=dy/d*(sp+wave*0.08); });
    for(let i=foes.length-1;i>=0;i--){
      const f=foes[i];
      if(Math.hypot(f.x-p.x,f.y-p.y)<f.r+34){ f.hp--; slashes.push({a:Math.atan2(f.y-p.y,f.x-p.x),l:8}); burst(f.x,f.y,'#ffd1f2',10); shake=6; if(f.hp<=0){ score+=10+combo; combo=Math.min(9,combo+1); comboT=40; foes.splice(i,1); burst(f.x,f.y,'#ff4fd8',16); if(Math.random()<.18) drops.push({x:f.x,y:f.y}); } }
      else if(Math.hypot(f.x-p.x,f.y-p.y)<f.r+12){ hp-=0.8; shake=8; }
    }
    drops.forEach(d=>{ if(Math.hypot(d.x-p.x,d.y-p.y)<26){ hp=Math.min(100,hp+18); d.dead=1; burst(d.x,d.y,'#7cffd2',10);} });
    drops=drops.filter(d=>!d.dead);
    if(comboT>0) comboT--; else combo=0;
    if(hp<=0) return dead();
    scoreEl.textContent = 'WAVE '+wave+'   '+score+(combo>1?'  x'+combo:'');
    bar.style.width=Math.max(0,hp)+'%';
  }
  slashes.forEach(s=>s.l--); slashes=slashes.filter(s=>s.l>0);
  bits.forEach(b=>{ b.x+=b.vx; b.y+=b.vy; b.l--; }); bits=bits.filter(b=>b.l>0);
  drops.forEach(d=>{ g.fillStyle='#7cffd2'; g.beginPath(); g.arc(d.x,d.y,7,0,6.28); g.fill(); });
  foes.forEach(f=>{ g.fillStyle=f.fast?'#ffb020':'#ff4d6d'; g.beginPath(); g.arc(f.x,f.y,f.r,0,6.28); g.fill(); });
  bits.forEach(b=>{ g.globalAlpha=Math.max(0,b.l/20); g.fillStyle=b.c; g.fillRect(b.x,b.y,3,3); g.globalAlpha=1; });
  g.save(); g.translate(p.x,p.y);
  slashes.forEach(s=>{ g.strokeStyle='rgba(255,255,255,.8)'; g.lineWidth=4; g.beginPath(); g.arc(0,0,36,s.a-0.8,s.a+0.8); g.stroke(); });
  g.fillStyle='#f2e9ff'; g.beginPath(); g.arc(0,0,12,0,6.28); g.fill();
  g.strokeStyle='#ff4fd8'; g.lineWidth=4; g.beginPath(); g.arc(0,0,18,0,6.28); g.stroke();
  g.restore(); g.restore();
}
requestAnimationFrame(loop);
</script>
</body>
</html>
