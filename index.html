<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Job Quote Calculator | Work Out What To Charge</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    color: #17202a;
}

.container {
    max-width: 520px;
    margin: 30px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 28px;
    border-radius: 16px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

h1 {
    margin: 0 0 10px;
    font-size: 30px;
    text-align: center;
}

.subtitle {
    text-align: center;
    color: #667085;
    margin-bottom: 25px;
    line-height: 1.5;
}

label {
    display: block;
    margin-top: 17px;
    margin-bottom: 6px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    background: #111827;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.result {
    display: none;
    margin-top: 25px;
    padding: 22px;
    border-radius: 12px;
    text-align: center;
}

.result h2 {
    margin-top: 0;
}

.big-number {
    font-size: 34px;
    font-weight: bold;
    margin: 10px 0;
}

.detail {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid rgba(0,0,0,0.08);
}

.good {
    background: #e7f6ec;
}

.warning {
    background: #fff4d6;
}

.bad {
    background: #ffe5e5;
}

.note {
    margin-top: 18px;
    font-size: 13px;
    color: #667085;
    text-align: center;
    line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>What Should I Charge?</h1>

<p class="subtitle">
Work out your minimum quote and see what you'll really earn from a job.
</p>

<label>Job price (£)</label>
<input type="number" id="price" placeholder="e.g. 500">

<label>Hours working</label>
<input type="number" id="hours" placeholder="e.g. 6">

<label>Travel time (hours)</label>
<input type="number" id="travelTime" placeholder="e.g. 1">

<label>Materials (£)</label>
<input type="number" id="materials" placeholder="e.g. 120">

<label>Travel / fuel costs (£)</label>
<input type="number" id="travelCost" placeholder="e.g. 30">

<label>Your target hourly rate (£)</label>
<input type="number" id="targetRate" placeholder="e.g. 40">

<button onclick="calculate()">Calculate My Quote</button>

<div id="result" class="result"></div>

<p class="note">
This is a simple estimate and doesn't account for tax, VAT,
insurance or other business overheads.
</p>

</div>

</div>

<script>

function calculate() {

    const price = Number(document.getElementById("price").value);
    const hours = Number(document.getElementById("hours").value);
    const travelTime = Number(document.getElementById("travelTime").value);
    const materials = Number(document.getElementById("materials").value);
    const travelCost = Number(document.getElementById("travelCost").value);
    const targetRate = Number(document.getElementById("targetRate").value);

    if (price <= 0 || hours <= 0 || targetRate <= 0) {
        alert("Please enter the job price, working hours and target hourly rate.");
        return;
    }

    const totalTime = hours + travelTime;

    const costs = materials + travelCost;

    const profit = price - costs;

    const actualHourlyRate = profit / totalTime;

    /*
       Work backwards to calculate the minimum quote.

       Target earnings =
       target hourly rate × total time

       Then add the costs.
    */

    const minimumQuote = (targetRate * totalTime) + costs;

    /*
       Add a small buffer to protect against unexpected costs/time.
    */

    const recommendedQuote = minimumQuote * 1.10;

    const result = document.getElementById("result");

    result.style.display = "block";

    let status;
    let className;

    if (actualHourlyRate >= targetRate) {

        status = "🟢 GOOD JOB";
        className = "good";

    } else if (actualHourlyRate >= targetRate * 0.75) {

        status = "🟠 CONSIDER NEGOTIATING";
        className = "warning";

    } else {

        status = "🔴 TOO LOW";
        className = "bad";
    }

    result.className = "result " + className;

    result.innerHTML = `

        <h2>${status}</h2>

        <p>Recommended quote</p>

        <div class="big-number">
            £${recommendedQuote.toFixed(2)}
        </div>

        <div class="detail">
            <span>Minimum quote</span>
            <strong>£${minimumQuote.toFixed(2)}</strong>
        </div>

        <div class="detail">
            <span>Your current quote</span>
            <strong>£${price.toFixed(2)}</strong>
        </div>

        <div class="detail">
            <span>Estimated hourly rate</span>
            <strong>£${actualHourlyRate.toFixed(2)}</strong>
        </div>

        <div class="detail">
            <span>Total time</span>
            <strong>${totalTime.toFixed(1)} hours</strong>
        </div>

        <p style="margin-top:18px;">
            Based on your target rate and the costs you entered,
            you should aim for around
            <strong>£${recommendedQuote.toFixed(2)}</strong>
            for this job.
        </p>
    `;
}

</script>

</body>
</html>
