<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pac-Man Mini Game</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 10px; background: #080820; color: white; font-family: Arial, sans-serif; text-align: center; }
  h1 { color: #ffe600; letter-spacing: 4px; }
  #score { font-size: 22px; margin: 12px; }
  canvas { display: block; width: min(450px, 96vw); height: auto; margin: 15px auto; background: #000; border: 3px solid #3434ff; }
  p { color: #ccccff; }
  button { border: 0; border-radius: 8px; padding: 12px 22px; margin: 8px; background: #ffe600; color: #000; font-size: 16px; font-weight: bold; cursor: pointer; }
  .controls { display: grid; grid-template-columns: repeat(3, 54px); gap: 5px; justify-content: center; margin: 12px auto; }
  .controls button { margin: 0; padding: 12px 0; }
</style>
</head>
<body>
<h1>PAC-MAN</h1>
<div id="score">Score: 0</div>
<canvas id="game" width="420" height="420" aria-label="Pac-Man game"></canvas>
<p>Use arrow keys or WASD to move. Collect dots and avoid the red ghost!</p>
<div class="controls" aria-label="Touch controls">
  <span></span><button onclick="movePlayer(0,-1)" aria-label="Up">▲</button><span></span>
  <button onclick="movePlayer(-1,0)" aria-label="Left">◀</button>
  <button onclick="movePlayer(0,1)" aria-label="Down">▼</button>
  <button onclick="movePlayer(1,0)" aria-label="Right">▶</button>
</div>
<button onclick="restartGame()">Restart Game</button>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreDisplay = document.getElementById("score");
const tile = 28;
const originalMap = [
  "###############",
  "#.............#",
  "#.###.###.###.#",
  "#.............#",
  "#.###.#.#.###.#",
  "#.....#.#.....#",
  "#####.#.#.#####",
  "#.............#",
  "#.###.###.###.#",
  "#.............#",
  "#.###.#.#.###.#",
  "#.....#.#.....#",
  "#####.#.#.#####",
  "#.............#",
  "###############"
];
let map, player, ghost, score, gameOver, won, ghostTimer;

function restartGame() {
  clearInterval(ghostTimer);
  map = originalMap.map(row => row.split(""));
  player = {x: 1, y: 1};
  ghost = {x: 13, y: 13};
  score = 0;
  gameOver = false;
  won = false;
  scoreDisplay.textContent = "Score: 0";
  draw();
  ghostTimer = setInterval(moveGhost, 300);
}
function isWall(x, y) {
  return !map[y] || map[y][x] === "#";
}
function movePlayer(dx, dy) {
  if (gameOver || won) return;
  const nx = player.x + dx, ny = player.y + dy;
  if (!isWall(nx, ny)) {
    player.x = nx; player.y = ny;
    if (map[ny][nx] === ".") {
      map[ny][nx] = " ";
      score += 10;
      scoreDisplay.textContent = "Score: " + score;
    }
    checkGame();
    draw();
  }
}
document.addEventListener("keydown", event => {
  const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
  const keys = {
    ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
    w:[0,-1], s:[0,1], a:[-1,0], d:[1,0]
  };
  if (keys[key]) {
    event.preventDefault();
    movePlayer(...keys[key]);
  }
});
function moveGhost() {
  if (gameOver || won) return;
  const choices = [[1,0],[-1,0],[0,1],[0,-1]]
    .map(([dx,dy]) => ({x:ghost.x+dx,y:ghost.y+dy}))
    .filter(p => !isWall(p.x,p.y));
  if (!choices.length) return;
  choices.sort((a,b) =>
    (Math.abs(a.x-player.x)+Math.abs(a.y-player.y)) -
    (Math.abs(b.x-player.x)+Math.abs(b.y-player.y))
  );
  // Usually chase the player, with a little unpredictability.
  const next = Math.random() < 0.75 ? choices[0] : choices[Math.floor(Math.random()*choices.length)];
  ghost.x = next.x; ghost.y = next.y;
  checkGame();
  draw();
}
function checkGame() {
  if (player.x === ghost.x && player.y === ghost.y) {
    gameOver = true;
    clearInterval(ghostTimer);
  }
  if (map.every(row => row.every(cell => cell !== "."))) {
    won = true;
    clearInterval(ghostTimer);
  }
}
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for (let y=0; y<map.length; y++) {
    for (let x=0; x<map[y].length; x++) {
      const px=x*tile, py=y*tile;
      if (map[y][x] === "#") {
        ctx.fillStyle="#1717bd";
        ctx.fillRect(px,py,tile,tile);
        ctx.strokeStyle="#4444ff";
        ctx.strokeRect(px+2,py+2,tile-4,tile-4);
      } else if (map[y][x] === ".") {
        ctx.fillStyle="#fff2b0";
        ctx.beginPath();
        ctx.arc(px+tile/2,py+tile/2,3,0,Math.PI*2);
        ctx.fill();
      }
    }
  }
  // Pac-Man
  ctx.fillStyle="#ffe600";
  ctx.beginPath();
  ctx.arc(player.x*tile+tile/2,player.y*tile+tile/2,11,0.25*Math.PI,1.75*Math.PI);
  ctx.lineTo(player.x*tile+tile/2,player.y*tile+tile/2);
  ctx.fill();
  // Ghost
  const gx=ghost.x*tile, gy=ghost.y*tile;
  ctx.fillStyle="#ff3434";
  ctx.beginPath();
  ctx.arc(gx+14,gy+13,11,Math.PI,0);
  ctx.lineTo(gx+25,gy+25); ctx.lineTo(gx+19,gy+21);
  ctx.lineTo(gx+14,gy+25); ctx.lineTo(gx+8,gy+21);
  ctx.lineTo(gx+3,gy+25); ctx.lineTo(gx+3,gy+13);
  ctx.fill();
  ctx.fillStyle="white";
  ctx.beginPath(); ctx.arc(gx+10,gy+12,3,0,Math.PI*2); ctx.arc(gx+19,gy+12,3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#111";
  ctx.beginPath(); ctx.arc(gx+11,gy+12,1.5,0,Math.PI*2); ctx.arc(gx+20,gy+12,1.5,0,Math.PI*2); ctx.fill();
  if (gameOver || won) {
    ctx.fillStyle="rgba(0,0,0,0.78)";
    ctx.fillRect(0,150,420,120);
    ctx.fillStyle=won?"#ffe600":"#ff5555";
    ctx.font="bold 30px Arial";
    ctx.textAlign="center";
    ctx.fillText(won?"YOU WIN!":"GAME OVER",210,200);
    ctx.fillStyle="white";
    ctx.font="16px Arial";
    ctx.fillText("Press Restart Game to play again",210,232);
  }
}
restartGame();
</script>
</body>
</html>
