<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STREET XI</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#071018;color:white;font-family:Arial}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#071018;z-index:5}
.box{text-align:center}
.logo{font-size:54px;font-weight:900;letter-spacing:8px}
.sub{opacity:.65;margin-top:10px}
#hud{position:fixed;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;z-index:2;pointer-events:none}
.panel{background:#071018b8;padding:12px 16px;border:1px solid #ffffff22;border-radius:12px;backdrop-filter:blur(8px)}
#help{position:fixed;bottom:15px;left:15px;z-index:2}
#msg{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);font-size:52px;font-weight:900;opacity:0;z-index:3;text-shadow:0 4px 25px #000}
canvas{display:block}
</style>
</head>
<body>
<div id="loading">
  <div class="box">
    <div class="logo">STREET XI</div>
    <div class="sub">OPEN WORLD FOOTBALL</div>
  </div>
</div>
<div id="hud">
  <div class="panel" id="score">CITY FC 0 — 0 RIVALS<br><small>05:00</small></div>
  <div class="panel">STAMINA <span id="st">100%</span></div>
</div>
<div id="help" class="panel">WASD / ARROWS · SHIFT SPRINT · SPACE SHOOT · E PASS · R RESET</div>
<div id="msg"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91a9b8);
scene.fog=new THREE.Fog(0x91a9b8,180,750);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1200);
const hemi=new THREE.HemisphereLight(0xcfe5ff,0x26331d,2);
scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffefd0,4);
sun.position.set(150,250,100);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

const M=(c,r=.8)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
function add(g){g.castShadow=g.receiveShadow=true;scene.add(g);return g}
function B(w,h,d,m,x=0,y=h/2,z=0){let o=add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m));o.position.set(x,y,z);return o}
function S(r,m,x=0,y=r,z=0){let o=add(new THREE.Mesh(new THREE.SphereGeometry(r,20,16),m));o.position.set(x,y,z);return o}

const grass=M(0x176633),white=M(0xf5f2e7,.55),road=M(0x20262c,1),dark=M(0x101820),blue=M(0x1688e8),red=M(0xe83d42),skin=M(0xb87352),black=M(0x101010);

B(1100,.2,1100,M(0x4b554e,1),0,-.1,0);
for(let x=-500;x<=500;x+=90)B(18,.12,1100,road,x,.01,0);
for(let z=-500;z<=500;z+=90)B(1100,.12,18,road,0,.01,z);

for(let x=-500;x<=500;x+=55)for(let z=-500;z<=500;z+=55){
  if(Math.abs(x)<180&&Math.abs(z)<150)continue;
  let h=15+Math.random()*65;
  B(28+Math.random()*18,h,28+Math.random()*18,M([0x5f6a72,0x7c878e,0x3e4952,0xa09589,0x4a5963][Math.floor(Math.random()*5)],.82),x+(Math.random()-.5)*10,h/2,z+(Math.random()-.5)*10)
}

B(250,.8,190,dark,0,.4,0);
B(160,.25,96,grass,0,1,0);
B(156,.18,2,white,0,1.2,0);
B(2,.18,96,white,0,1.2,0);
B(2,.18,96,white,-78,1.2,0);
B(2,.18,96,white,78,1.2,0);
B(2,.18,30,white,-55,1.2,0);
B(2,.18,30,white,55,1.2,0);
let ring=add(new THREE.Mesh(new THREE.RingGeometry(13,13.5,64),white));
ring.rotation.x=-Math.PI/2;
ring.position.y=1.21;

for(let r=0;r<6;r++){
  B(230,4,7,M(0x2a333a),0,6+r*6,-107-r*2);
  B(230,4,7,M(0x2a333a),0,6+r*6,107+r*2);
  B(7,4,180,M(0x2a333a),-128-r*2,6+r*6,0);
  B(7,4,180,M(0x2a333a),128+r*2,6+r*6,0)
}

function player(c,x,z){
  let g=new THREE.Group();
  g.position.set(x,0,z);
  let body=new THREE.Mesh(new THREE.BoxGeometry(2,3,1.1),M(c,.6));
  body.position.y=4;g.add(body);
  let head=new THREE.Mesh(new THREE.SphereGeometry(1,18,14),skin);
  head.position.y=6.1;g.add(head);
  let l=new THREE.Mesh(new THREE.BoxGeometry(.55,2.8,.55),skin);
  l.position.set(-1.3,3.8,0);g.add(l);
  let l2=l.clone();l2.position.x=1.3;g.add(l2);
  let k=new THREE.Mesh(new THREE.BoxGeometry(.65,2.7,.65),black);
  k.position.set(-.5,1.5,0);g.add(k);
  let k2=k.clone();k2.position.x=.5;g.add(k2);
  g.traverse(o=>{if(o.isMesh)o.castShadow=true});
  scene.add(g);
  g.userData={legs:[k,k2],arms:[l,l2],phase:Math.random()*6};
  return g
}

const p=player(blue,0,35),
      mates=[player(blue,-30,0),player(blue,25,-20),player(blue,-30,-30)],
      enemies=[player(red,35,5),player(red,20,-30),player(red,-40,0),player(red,55,30)],
      keeper=player(0xf4c542,73,0);
const ball=S(1.15,M(0xffffff,.3),0,2.2,28);
ball.userData.v=new THREE.Vector3();

const keys={};
onkeydown=e=>{
  keys[e.key.toLowerCase()]=1;
  if(e.code==='Space'){e.preventDefault();shoot()}
  if(e.key.toLowerCase()==='e')pass();
  if(e.key.toLowerCase()==='r')reset()
};
onkeyup=e=>keys[e.key.toLowerCase()]=0;

let stamina=100,a=0,b=0,t=300,cool=0;

function shoot(){
  if(cool)return;
  let d=new THREE.Vector3(0,0,-1).applyQuaternion(p.quaternion);
  ball.position.copy(p.position).add(new THREE.Vector3(0,2.5,0)).add(d.clone().multiplyScalar(3));
  ball.userData.v=d.multiplyScalar(34);
  cool=.4
}
function pass(){
  let m=mates[0],d=m.position.clone().sub(ball.position);
  d.y=0;d.normalize();
  ball.userData.v=d.multiplyScalar(20)
}
function reset(){
  p.position.set(0,0,35);
  ball.position.set(0,2.2,28);
  ball.userData.v.set(0,0,0)
}
function animate(q,dt,s){
  q.userData.phase+=dt*(5+s*5);
  let ph=q.userData.phase;
  q.userData.legs[0].rotation.x=Math.sin(ph)*.6*s;
  q.userData.legs[1].rotation.x=-Math.sin(ph)*.6*s;
  q.userData.arms[0].rotation.x=-Math.sin(ph)*.4*s;
  q.userData.arms[1].rotation.x=Math.sin(ph)*.4*s
}

function loop(now){
  requestAnimationFrame(loop);
  let dt=Math.min(.033,(now-(loop.last||now))/1000);
  loop.last=now;
  cool=Math.max(0,cool-dt);

  let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),
      z=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  let v=new THREE.Vector3(x,0,z);
  if(v.length()>1)v.normalize();
  let sprint=keys.shift&&stamina>1;
  if(sprint&&v.length())stamina=Math.max(0,stamina-dt*25);
  else stamina=Math.min(100,stamina+dt*12);
  let sp=sprint?27:16;
  p.position.addScaledVector(v,sp*dt);
  p.position.x=THREE.MathUtils.clamp(p.position.x,-73,73);
  p.position.z=THREE.MathUtils.clamp(p.position.z,-43,43);
  if(v.length())p.rotation.y=Math.atan2(v.x,v.z);
  animate(p,dt,v.length());

  enemies.forEach((e,i)=>{
    let d=(i===0?ball.position:p.position).clone().sub(e.position);
    d.y=0;
    if(d.length()>3)d.normalize();
    e.position.addScaledVector(d,10*dt);
    if(d.length())e.rotation.y=Math.atan2(d.x,d.z);
    animate(e,dt,d.length()/10)
  });

  mates.forEach(m=>{
    let d=m.position.clone().sub(p.position);
    d.y=0;
    if(d.length()>25){d.normalize();m.position.addScaledVector(d,-7*dt)}
    animate(m,dt,.2)
  });

  let kd=ball.position.clone().sub(keeper.position);
  kd.y=0;
  if(kd.length()>4)kd.normalize();
  else kd.set(0,0,0);
  keeper.position.addScaledVector(kd,7*dt);

  if(p.position.distanceTo(ball.position)<5&&!cool)
    ball.position.lerp(p.position.clone().add(new THREE.Vector3(0,2.3,0)),.3);

  ball.position.addScaledVector(ball.userData.v,dt);
  ball.userData.v.multiplyScalar(Math.pow(.985,dt*60));
  if(ball.position.y>1.15)ball.userData.v.y-=30*dt;
  else{ball.position.y=1.15;ball.userData.v.y*=-.35}

  if(Math.abs(ball.position.x)>78){
    if(Math.abs(ball.position.z)<11&&ball.position.x>78){a++;reset()}
    else if(Math.abs(ball.position.z)<11&&ball.position.x<-78){b++;reset()}
    ball.position.x=THREE.MathUtils.clamp(ball.position.x,-78,78);
    ball.userData.v.x*=-.5
  }
  if(Math.abs(ball.position.z)>48){
    ball.position.z=THREE.MathUtils.clamp(ball.position.z,-48,48);
    ball.userData.v.z*=-.5
  }

  t=Math.max(0,t-dt);
  document.getElementById('score').innerHTML=`CITY FC ${a} — ${b} RIVALS<br><small>${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}</small>`;
  document.getElementById('st').textContent=Math.round(stamina)+'%';

  let f=new THREE.Vector3(Math.sin(p.rotation.y),0,Math.cos(p.rotation.y));
  let want=p.position.clone().add(new THREE.Vector3(0,13,0)).add(f.clone().multiplyScalar(22));
  camera.position.lerp(want,1-Math.pow(.0005,dt));
  camera.lookAt(p.position.clone().add(new THREE.Vector3(0,4,0)).add(f.multiplyScalar(9)));
  renderer.render(scene,camera)
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight)
});

setTimeout(()=>document.getElementById('loading').remove(),900);
loop(performance.now());
</script>
</body>
</html>
