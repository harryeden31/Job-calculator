<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What Should I Charge? | UK Trade Quote Calculator</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #17202a;
    }
    .container {
      max-width: 650px;
      margin: 0 auto;
      padding: 25px 16px 50px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }
    h1 {
      margin-top: 0;
      font-size: 30px;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #667085;
      margin-bottom: 25px;
    }
    label {
      display: block;
      font-weight: bold;
      margin: 16px 0 7px;
    }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd2d8;
      border-radius: 9px;
      font-size: 16px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 15px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 18px;
    }
    #calculateBtn {
      background: #17202a;
      color: white;
    }
    #quoteBtn {
      background: #16a34a;
      color: white;
    }
    #quoteBtn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .results {
      display: none;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    .result-row strong {
      text-align: right;
    }
    .recommended {
      background: #ecfdf3;
      border: 1px solid #86efac;
      border-radius: 12px;
      padding: 18px;
      margin-top: 18px;
      text-align: center;
    }
    .recommended .price {
      font-size: 32px;
      font-weight: bold;
      color: #15803d;
      margin: 8px 0;
    }
    .status {
      font-weight: bold;
      text-align: center;
      margin-top: 12px;
    }
    .email-box {
      margin-top: 22px;
      padding: 18px;
      background: #f8fafc;
      border-radius: 12px;
    }
    .small {
      font-size: 13px;
      color: #667085;
      margin-top: 8px;
      line-height: 1.4;
    }
    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>What Should I Charge?</h1>
    <div class="subtitle">
      UK trade job quote calculator
    </div>
    <label for="jobPrice">Current job price (£)</label>
    <input id="jobPrice" type="number" min="0" step="0.01" placeholder="e.g. 450">
    <label for="hours">Hours working</label>
    <input id="hours" type="number" min="0" step="0.1" placeholder="e.g. 6">
    <label for="travelTime">Travel time (hours)</label>
    <input id="travelTime" type="number" min="0" step="0.1" placeholder="e.g. 1">
    <label for="materials">Materials (£)</label>
    <input id="materials" type="number" min="0" step="0.01" placeholder="e.g. 80">
    <label for="travel">Travel / fuel (£)</label>
    <input id="travel" type="number" min="0" step="0.01" placeholder="e.g. 20">
    <label for="targetRate">Target hourly rate (£)</label>
    <input id="targetRate" type="number" min="0" step="0.01" placeholder="e.g. 40">
    <button id="calculateBtn">Calculate</button>
    <div id="results" class="results">
      <div class="result-row">
        <span>Total time</span>
        <strong id="totalTime">£0</strong>
      </div>
      <div class="result-row">
        <span>Total costs</span>
        <strong id="totalCosts">£0</strong>
      </div>
      <div class="result-row">
        <span>Estimated profit</span>
        <strong id="profit">£0</strong>
      </div>
      <div class="result-row">
        <span>Actual hourly rate</span>
        <strong id="hourlyRate">£0</strong>
      </div>
      <div class="result-row">
        <span>Minimum quote</span>
        <strong id="minimumQuote">£0</strong>
      </div>
      <div class="recommended">
        <div>Recommended quote</div>
        <div class="price" id="recommendedQuote">£0</div>
        <div id="status" class="status"></div>
      </div>
      <div class="email-box">
        <label for="email">
          Email address for your professional quote
        </label>
        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
        >
        <div class="small">
          After payment, your customer-ready professional quote will be sent to this email address.
        </div>
        <button id="quoteBtn">
          Get Professional Quote — £3
        </button>
        <div id="message"></div>
      </div>
    </div>
  </div>
</div>
<script>
const WORKER_URL =
  "https://professional-quote.harryeden.workers.dev";
let quoteData = null;
document
  .getElementById("calculateBtn")
  .addEventListener("click", calculateQuote);
document
  .getElementById("quoteBtn")
  .addEventListener("click", startCheckout);
function money(value) {
  return "£" + Number(value).toFixed(2);
}
function calculateQuote() {
  const jobPrice =
    Number(document.getElementById("jobPrice").value) || 0;
  const hours =
    Number(document.getElementById("hours").value) || 0;
  const travelTime =
    Number(document.getElementById("travelTime").value) || 0;
  const materials =
    Number(document.getElementById("materials").value) || 0;
  const travel =
    Number(document.getElementById("travel").value) || 0;
  const targetRate =
    Number(document.getElementById("targetRate").value) || 0;
  const totalTime = hours + travelTime;
  const totalCosts = materials + travel;
  const profit = jobPrice - totalCosts;
  const hourlyRate =
    totalTime > 0 ? profit / totalTime : 0;
  const minimumQuote =
    totalCosts + (totalTime * targetRate);
  const recommendedQuote =
    Math.ceil(minimumQuote / 5) * 5;
  document.getElementById("totalTime").textContent =
    totalTime.toFixed(1) + " hrs";
  document.getElementById("totalCosts").textContent =
    money(totalCosts);
  document.getElementById("profit").textContent =
    money(profit);
  document.getElementById("hourlyRate").textContent =
    money(hourlyRate) + "/hr";
  document.getElementById("minimumQuote").textContent =
    money(minimumQuote);
  document.getElementById("recommendedQuote").textContent =
    money(recommendedQuote);
  let status = "";
  if (hourlyRate >= targetRate) {
    status = "GOOD JOB";
  } else if (hourlyRate >= targetRate * 0.8) {
    status = "CONSIDER NEGOTIATING";
  } else {
    status = "TOO LOW";
  }
  document.getElementById("status").textContent = status;
  document.getElementById("results").style.display = "block";
  quoteData = {
    jobPrice,
    hours,
    travelTime,
    materials,
    travel,
    targetRate,
    recommendedQuote
  };
}
async function startCheckout() {
  const email =
    document.getElementById("email").value.trim();
  const message =
    document.getElementById("message");
  if (!quoteData) {
    message.textContent =
      "Please calculate your quote first.";
    return;
  }
  if (!email || !email.includes("@")) {
    message.textContent =
      "Please enter a valid email address.";
    return;
  }
  message.textContent =
    "Opening secure payment...";
  const button =
    document.getElementById("quoteBtn");
  button.disabled = true;
  try {
    const response = await fetch(
      WORKER_URL + "/create-checkout",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          email,
          ...quoteData
        })
      }
    );
    const result = await response.json();
    if (!response.ok || !result.url) {
      throw new Error("Unable to create checkout.");
    }
    window.location.href = result.url;
  } catch (error) {
    message.textContent =
      "Something went wrong. Please try again.";
    button.disabled = false;
  }
}
</script>
</body>
</html>
