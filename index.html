<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK Job Quote Calculator</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    border: none;
    border-radius: 6px;
    background: #111;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.result {
    margin-top: 25px;
    padding: 20px;
    background: #f7f7f7;
    border-radius: 8px;
}

.good {
    color: green;
    font-weight: bold;
}

.warning {
    color: orange;
    font-weight: bold;
}

.bad {
    color: red;
    font-weight: bold;
}

.pay-button {
    background: #635bff;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<h1>UK Job Quote Calculator</h1>

<p>Find out what you should charge for your next job.</p>

<label>Job Price (£)</label>
<input type="number" id="jobPrice" placeholder="Example: 250">

<label>Hours Working</label>
<input type="number" id="hours" placeholder="Example: 5">

<label>Travel Time (hours)</label>
<input type="number" id="travelTime" placeholder="Example: 1">

<label>Materials (£)</label>
<input type="number" id="materials" placeholder="Example: 50">

<label>Travel / Fuel (£)</label>
<input type="number" id="travelCost" placeholder="Example: 20">

<label>Your Target Hourly Rate (£)</label>
<input type="number" id="targetRate" placeholder="Example: 35">

<button onclick="calculate()">Calculate My Quote</button>

<div id="result"></div>

</div>

<script>

function calculate() {

    const jobPrice = parseFloat(document.getElementById("jobPrice").value) || 0;
    const hours = parseFloat(document.getElementById("hours").value) || 0;
    const travelTime = parseFloat(document.getElementById("travelTime").value) || 0;
    const materials = parseFloat(document.getElementById("materials").value) || 0;
    const travelCost = parseFloat(document.getElementById("travelCost").value) || 0;
    const targetRate = parseFloat(document.getElementById("targetRate").value) || 0;

    const totalTime = hours + travelTime;

    const totalCosts = materials + travelCost;

    const profit = jobPrice - totalCosts;

    const actualHourlyRate = totalTime > 0 ? profit / totalTime : 0;

    const minimumQuote = (targetRate * totalTime) + totalCosts;

    const recommendedQuote = minimumQuote * 1.15;

    let status = "";
    let statusClass = "";

    if (actualHourlyRate >= targetRate) {
        status = "GOOD JOB – Your quote meets your target rate.";
        statusClass = "good";
    } 
    else if (actualHourlyRate >= targetRate * 0.8) {
        status = "CONSIDER NEGOTIATING – Your quote is slightly below target.";
        statusClass = "warning";
    } 
    else {
        status = "TOO LOW – You may be undercharging.";
        statusClass = "bad";
    }

    document.getElementById("result").innerHTML = `

        <div class="result">

            <h2>Your Results</h2>

            <p><strong>Total Time:</strong> ${totalTime.toFixed(1)} hours</p>

            <p><strong>Total Costs:</strong> £${totalCosts.toFixed(2)}</p>

            <p><strong>Estimated Profit:</strong> £${profit.toFixed(2)}</p>

            <p><strong>Your Effective Hourly Rate:</strong> £${actualHourlyRate.toFixed(2)}</p>

            <p><strong>Minimum Quote:</strong> £${minimumQuote.toFixed(2)}</p>

            <p><strong>Recommended Quote:</strong> £${recommendedQuote.toFixed(2)}</p>

            <p class="${statusClass}">${status}</p>

            <button class="pay-button" onclick="payForQuote()">
                Get Professional Quote — £3
            </button>

        </div>
    `;
}

function payForQuote() {

    window.location.href = "https://buy.stripe.com/6oUcN4bdzaNh4aEdA8gA800";

}

</script>

</body>
</html>
